# Läuft bei jeder Änderung im Repository (auch bei Uploads über die GitHub-Weboberfläche):
#   1. erzeugt fehlende/geänderte Sprecherdateien (nur Szenen mit neuem Text)
#   2. baut die MP4-Downloads (nur geänderte Lernnuggets, Zwischenspeicher über actions/cache)
#   3. veröffentlicht die Website über GitHub Pages
# Manuell: GitHub > Actions > "Veröffentlichen" > Run workflow (dort Engine wählen).
#
# Sprachausgabe:
#   piper (Standard, kostenlos)  – Sprachmodell läuft im GitHub-Runner
#   azure                        – Secret AZURE_SPEECH_KEY anlegen; optional Variablen
#                                  AZURE_SPEECH_REGION (Standard germanywestcentral) und
#                                  AZURE_VOICE (Rückfall, Standard de-DE-KatjaNeural; je Stimme
#                                  ist in assets/stimmen.js eine Azure-Stimme hinterlegt).
#                                  Dauerhaft umstellen: Variable TTS_ENGINE = azure
#   (Settings > Secrets and variables > Actions)
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine:
        description: "Sprachausgabe"
        type: choice
        options: [piper, azure]
        default: piper
      alles:
        description: "Alle Szenen neu vertonen"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  sprecher:
    runs-on: ubuntu-latest
    env:
      ENGINE: ${{ inputs.engine || vars.TTS_ENGINE || 'piper' }}
      AZURE_VOICE: ${{ vars.AZURE_VOICE || 'de-DE-KatjaNeural' }}
    steps:
      - uses: actions/checkout@v4

      - name: Hochgeladene inhalte.json übernehmen
        run: |
          if [ -f data/inhalte.json ]; then
            python3 -c "import json; d=json.load(open('data/inhalte.json', encoding='utf-8')); assert d.get('nuggets'), 'keine Lernnuggets'; open('data/inhalte.js', 'w', encoding='utf-8').write('window.LERN_DATA = ' + json.dumps(d, ensure_ascii=False, indent=2) + ';\\n')"
            git rm -q data/inhalte.json
            git config user.name "sprecher-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/inhalte.js
            git commit -m "Inhalte aus hochgeladener inhalte.json übernommen" && git push
          fi

      - name: Werkzeuge bereitstellen (ffmpeg, rsvg-convert, Schrift, Pillow)
        run: |
          # Paketserver sind gelegentlich kurz nicht erreichbar: bis zu 4 Versuche
          for i in 1 2 3 4; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing -o Acquire::Retries=3 ffmpeg librsvg2-bin fonts-dejavu-core && break
            echo "Versuch $i fehlgeschlagen, neuer Versuch in 20 s"; sleep 20
          done
          command -v ffmpeg && command -v rsvg-convert
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow

      - name: Piper laden (Stimmen lädt tools/tts.py nach Bedarf)
        if: env.ENGINE == 'piper'
        run: |
          mkdir -p /tmp/piper && cd /tmp/piper
          curl -sSL -o piper.tgz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tgz

      - name: Stimmen zwischenspeichern
        if: env.ENGINE == 'piper'
        uses: actions/cache@v4
        with:
          path: /tmp/piper/stimmen
          key: piper-stimmen-${{ hashFiles('assets/stimmen.js') }}
          restore-keys: piper-stimmen-

      - name: Sprecherdateien erzeugen
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'germanywestcentral' }}
        run: |
          python3 tools/tts.py --engine "$ENGINE" --azure-stimme "$AZURE_VOICE" --piper /tmp/piper/piper/piper ${{ inputs.alles && '--alles' || '' }}

      - name: Sprecherdateien speichern
        run: |
          git config user.name "sprecher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "Keine neuen Sprecherdateien."; else git commit -m "Sprecherdateien aktualisiert ($ENGINE)"; git pull --rebase -X theirs origin main && git push; fi

      - name: Zwischenspeicher für Videos laden
        uses: actions/cache@v4
        with:
          path: downloads
          key: videos-${{ github.run_id }}
          restore-keys: videos-

      - name: MP4-Downloads bauen
        run: python3 tools/video.py

      - name: Cache-Kennung setzen (Browser laden nach jeder Veröffentlichung alle Dateien neu)
        run: sed -i "s/__BUILD__/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}/g" index.html studio.html anmelden.html konto.html verwaltung.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  seite:
    needs: sprecher
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
