<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- connect-src: eigener Server (Speichern, Hochladen) bzw. GitHub-API (nur lesend: Dateien in media/ auflisten). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com; font-src 'self'">
  <title>Studio – Lernnuggets</title>
  <link rel="stylesheet" href="assets/style.css?v=__BUILD__">
  <link rel="stylesheet" href="assets/studio.css?v=__BUILD__">
</head>
<body class="studio">
  <header class="topbar">
    <a href="index.html" class="brand" aria-label="Zur Lernplattform">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text"><strong>Lernnuggets</strong><small>Studio</small></span>
    </a>
    <nav class="topnav" aria-label="Hauptnavigation">
      <a href="index.html">Übersicht</a>
      <a href="studio.html" aria-current="page">Studio</a>
    </nav>
  </header>

  <div class="studio-bar">
    <div class="bar-title">
      <span id="bar-kontext">Studio</span>
      <strong id="bar-name">Inhalte</strong>
    </div>
    <span class="save-state" id="save-state" aria-live="polite"></span>
    <div class="bar-actions">
      <button class="btn on-dark ghost" id="btn-preview">Vorschau</button>
      <button class="btn on-dark" id="btn-export">Veröffentlichen …</button>
    </div>
  </div>

  <div class="studio-layout">
    <nav class="studio-nav" aria-label="Lernnuggets">
      <button class="nav-item settings-btn" id="btn-settings">Einstellungen der Plattform</button>
      <div class="nav-head"><h2>Lernnuggets</h2><button class="ctrl" id="btn-new" title="Neues Lernnugget anlegen">Neu anlegen</button></div>
      <ul id="nugget-list"></ul>
      <div class="nav-foot">
        <button class="linkbtn" id="btn-reset">Entwurf verwerfen</button>
      </div>
    </nav>

    <main id="editor" tabindex="-1"></main>

    <aside class="media-lib" aria-labelledby="lib-h">
      <h2 id="lib-h">Medien</h2>
      <p class="small" id="lib-text">Grafiken (SVG, PNG), Hintergrundbilder (JPG, PNG) und optional Videos (.mov, .mp4). Sie werden nur in diesem Browser geladen, nichts wird hochgeladen.</p>
      <div class="drop" id="drop">
        <label class="btn ghost file-btn">Dateien auswählen<input type="file" id="file-in" accept=".svg,.png,.jpg,.jpeg,.webp,.mov,.mp4,.m4v,.webm,image/*,video/*" multiple hidden></label>
        <span>oder hierher ziehen</span>
      </div>
      <p class="small" id="repo-info"></p>
      <ul id="lib-list" class="lib-list"></ul>
    </aside>
  </div>

  <dialog id="dlg-export" aria-labelledby="dlg-h">
    <form method="dialog" class="dlg">
      <h2 id="dlg-h">Veröffentlichen</h2>
      <div id="dlg-body"></div>
      <div class="dlg-actions" id="dlg-actions"><button class="btn ghost" value="close">Schließen</button><button class="btn ghost" id="btn-json" type="button">Als .json herunterladen</button><button class="btn" id="btn-copy" type="button">Inhalte kopieren</button></div>
    </form>
  </dialog>

  <script src="data/inhalte.js?v=__BUILD__"></script>
  <script src="assets/icons.js?v=__BUILD__"></script>
  <script src="assets/szene.js?v=__BUILD__"></script>
  <script src="assets/stimmen.js?v=__BUILD__"></script>
  <script src="assets/aussprache.js?v=__BUILD__"></script>
  <script src="audio/stimmen/index.js?v=__BUILD__"></script>
  <script src="assets/studio.js?v=__BUILD__"></script>
</body>
</html>
